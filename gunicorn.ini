import multiprocessing
import os


# ---------------------------------------------------------
# Application
# ---------------------------------------------------------

chdir = "/app"

# Alternatively, leave this out and start Gunicorn with:
# gunicorn --config /app/gunicorn.conf.py sss.wsgi:application
wsgi_app = "sss.wsgi:application"


# ---------------------------------------------------------
# Network
# ---------------------------------------------------------

bind = "0.0.0.0:8080"

# Pending connections waiting to be accepted.
# Ensure the container/pod file descriptor limit supports this.
backlog = 4096

# Keep connections open briefly for repeated tile requests.
keepalive = 5


# ---------------------------------------------------------
# Worker processes
# ---------------------------------------------------------

worker_class = "gevent"

# Closely matches the existing uWSGI process count.
# Reduce this if each Django process uses substantial memory.
workers = int(os.getenv("GUNICORN_WORKERS", "16"))

# uWSGI previously used:
#   18 processes x 100 greenlets = approximately 1,800 connections
#
# 1,000 per worker allows more tile concurrency without exposing
# the application to the current theoretical 80,000 connections.
worker_connections = int(
    os.getenv("GUNICORN_WORKER_CONNECTIONS", "1000")
)

# Use /dev/shm rather than the container filesystem for worker
# heartbeat temporary files.
worker_tmp_dir = "/dev/shm"


# ---------------------------------------------------------
# Worker recycling
# ---------------------------------------------------------

max_requests = 5000
max_requests_jitter = 256

# Gunicorn has no direct equivalent to uWSGI reload-on-rss.
# Worker recycling provides some protection against gradual
# memory growth, but Kubernetes memory limits should provide
# the hard upper boundary.


# ---------------------------------------------------------
# Timeouts
# ---------------------------------------------------------

# Maximum time a worker can remain silent before Gunicorn
# terminates and restarts it.
timeout = 2700

# Time allowed for a worker to finish during graceful shutdown.
graceful_timeout = 120


# ---------------------------------------------------------
# Logging
# ---------------------------------------------------------

# Disable access logging, equivalent to the existing setup.
accesslog = None

# Keep Gunicorn errors visible in container logs.
errorlog = "-"
loglevel = "info"

capture_output = True


# ---------------------------------------------------------
# Process handling
# ---------------------------------------------------------

# Equivalent to uWSGI die-on-term.
# Gunicorn handles SIGTERM as a graceful shutdown automatically.

proc_name = "sss-gunicorn"

# Only use these when Gunicorn initially starts as root.
# In Kubernetes, prefer securityContext.runAsUser/runAsGroup.
# user = os.getenv("GUNICORN_USER", "oim")
# group = os.getenv("GUNICORN_GROUP", "oim")


# ---------------------------------------------------------
# Application loading
# ---------------------------------------------------------

# Leave disabled initially. Enabling preload can reduce memory
# through copy-on-write, but it can cause problems with database
# connections, background threads, and initialization code.
preload_app = False
